name: Linux Smoke

# The same flows PR checks run, on demand: useful for reproducing a Linux-only failure or
# exercising a runner PR checks does not cover. The steps live in .github/actions/mcs-smoke so
# there is one definition of what a smoke run is.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner to smoke-test on
        required: true
        default: ubuntu-22.04
        type: choice
        options:
          - ubuntu-22.04
          - ubuntu-22.04-arm

permissions:
  contents: read

env:
  # Keep in sync with pr-checks.yml.
  SWIFT_VERSION: '6.2.0'

jobs:
  smoke:
    name: Smoke (${{ inputs.runner }})
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-swift-linux
        with:
          swift-version: ${{ env.SWIFT_VERSION }}

      - name: Build
        run: |
          swift build -c release
          echo "MCS=$(swift build -c release --show-bin-path)/mcs" >> "$GITHUB_ENV"

      - uses: ./.github/actions/mcs-smoke
        with:
          mcs: ${{ env.MCS }}
