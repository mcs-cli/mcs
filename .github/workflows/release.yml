name: Release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

env:
  # Keep in sync with pr-checks.yml.
  SWIFT_VERSION: '6.2.0'

concurrency:
  group: release

jobs:
  verify-version:
    name: Verify Version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches source version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          SOURCE_VERSION=$(grep -m1 'static let current' Sources/mcs/CLI.swift | sed 's/.*"\(.*\)".*/\1/')
          if [ "$SOURCE_VERSION" != "$TAG_NAME" ]; then
            echo "::error::Version mismatch: tag is '${TAG_NAME}' but MCSVersion.current is '${SOURCE_VERSION}'. Update MCSVersion.current in Sources/mcs/CLI.swift before tagging."
            exit 1
          fi
          echo "Version check passed: ${TAG_NAME}"

  release-notes:
    name: Release Notes
    needs: verify-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      notes: ${{ steps.build.outputs.notes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build release notes
        id: build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          NOTES=$(.github/scripts/release-notes.sh build "${TAG_NAME}")
          echo "${NOTES}"
          {
            echo "notes<<RELEASE_NOTES_EOF"
            echo "${NOTES}"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

  resolve:
    name: Resolve Dependencies
    needs: verify-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: |
            .build/checkouts
            .build/repositories
            .build/workspace-state.json
          key: spm-${{ hashFiles('Package.swift') }}
          restore-keys: spm-

      - name: Resolve packages
        run: swift package resolve

  test:
    name: Test
    needs: resolve
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache/restore@v6
        with:
          path: |
            .build/checkouts
            .build/repositories
            .build/workspace-state.json
          key: spm-${{ hashFiles('Package.swift') }}
          restore-keys: spm-

      - name: Test
        run: swift test

  test-linux:
    name: Test (${{ matrix.runner }})
    needs: verify-version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-swift-linux
        with:
          swift-version: ${{ env.SWIFT_VERSION }}

      - uses: actions/cache@v6
        with:
          path: |
            .build/checkouts
            .build/repositories
            .build/workspace-state.json
          key: spm-${{ hashFiles('Package.swift') }}
          restore-keys: spm-

      # --no-parallel for the reason in docs/linux-support.md: corelibs Foundation leaks write
      # descriptors into concurrently forked children, surfacing as a spurious ETXTBSY.
      - name: Test
        run: swift test --no-parallel

  build-macos:
    name: Build macOS Universal Binary
    needs: [test]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache/restore@v6
        with:
          path: |
            .build/checkouts
            .build/repositories
            .build/workspace-state.json
          key: spm-${{ hashFiles('Package.swift') }}
          restore-keys: spm-

      - name: Build universal binary
        run: |
          swift build -c release --arch arm64 --arch x86_64
          echo "BIN_DIR=$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)" >> "$GITHUB_ENV"

      - name: Verify binary
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          BUILT_VERSION=$("${BIN_DIR}/mcs" --version)
          if [ "$BUILT_VERSION" != "$TAG_NAME" ]; then
            echo "::error::Built binary reports version '${BUILT_VERSION}' but tag is '${TAG_NAME}'"
            exit 1
          fi
          echo "Binary verified: ${BUILT_VERSION}"

      - name: Prepare artifact
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: tar -czf "mcs-${TAG_NAME}-macos-universal.tar.gz" -C "${BIN_DIR}" mcs

      - uses: actions/upload-artifact@v7
        with:
          name: mcs-macos-universal
          path: mcs-${{ github.ref_name }}-macos-universal.tar.gz
          if-no-files-found: error

  build-linux:
    name: Build Linux ${{ matrix.arch }} Binary
    needs: [test, test-linux]
    # 22.04 on purpose, on both arches: it sets the glibc floor of the published binaries at 2.35.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-swift-linux
        with:
          swift-version: ${{ env.SWIFT_VERSION }}

      - uses: actions/cache/restore@v6
        with:
          path: |
            .build/checkouts
            .build/repositories
            .build/workspace-state.json
          key: spm-${{ hashFiles('Package.swift') }}
          restore-keys: spm-

      - name: Build release binary
        run: |
          swift build -c release --static-swift-stdlib
          echo "BIN_DIR=$(swift build -c release --static-swift-stdlib --show-bin-path)" >> "$GITHUB_ENV"

      - name: Verify binary
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          BUILT_VERSION=$("${BIN_DIR}/mcs" --version)
          if [ "$BUILT_VERSION" != "$TAG_NAME" ]; then
            echo "::error::Built binary reports version '${BUILT_VERSION}' but tag is '${TAG_NAME}'"
            exit 1
          fi
          # The asset name encodes the arch, so a mismatch would ship a binary nobody can run.
          BUILT_ARCH=$(uname -m)
          if [ "$BUILT_ARCH" != "${{ matrix.arch }}" ]; then
            echo "::error::Runner is ${BUILT_ARCH} but the asset is named ${{ matrix.arch }}"
            exit 1
          fi
          echo "Binary verified: ${BUILT_VERSION} (${BUILT_ARCH})"

      - name: Prepare artifact
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: tar -czf "mcs-${TAG_NAME}-linux-${{ matrix.arch }}.tar.gz" -C "${BIN_DIR}" mcs

      - uses: actions/upload-artifact@v7
        with:
          name: mcs-linux-${{ matrix.arch }}
          path: mcs-${{ github.ref_name }}-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  release:
    name: Release
    needs: [build-macos, build-linux, release-notes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Checksum artifacts
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          # sha256sum, not shasum: identical "<hash>  <file>" output and present on every runner.
          sha256sum -- *.tar.gz > SHA256SUMS
          cat SHA256SUMS
          echo "TARBALL=mcs-${TAG_NAME}-macos-universal.tar.gz" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          NOTES: ${{ needs.release-notes.outputs.notes }}
        run: |
          gh release create "${TAG_NAME}" \
            --repo "${{ github.repository }}" \
            --verify-tag \
            --notes "${NOTES}" \
            ./*.tar.gz SHA256SUMS

      - name: Update Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          TARBALL: ${{ env.TARBALL }}
        if: env.HOMEBREW_TAP_TOKEN != ''
        run: |
          # The formula keeps pointing at the macOS tarball; Linux ships as plain release assets.
          SHA=$(sha256sum "${TARBALL}" | cut -d' ' -f1)

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/mcs-cli/homebrew-tap.git" tap
          cd tap
          # This job has no checkout and Ubuntu runners have dotless hostnames, so git cannot
          # auto-detect an author and would refuse the commit. Same identity as auto-release.yml.
          git config user.email "autorelease@mcs-cli.dev"
          git config user.name "MCS Auto Release"
          cat > Formula/mcs.rb << FORMULA
          class Mcs < Formula
            desc "Configure Claude Code with MCP servers, plugins, skills, and hooks"
            homepage "https://github.com/mcs-cli/mcs"
            url "https://github.com/mcs-cli/mcs/releases/download/${TAG_NAME}/mcs-${TAG_NAME}-macos-universal.tar.gz"
            sha256 "${SHA}"
            version "${TAG_NAME}"
            license "MIT"

            def install
              libexec.install "mcs"
              bin.install_symlink libexec/"mcs"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/mcs --version")
            end
          end
          FORMULA

          git add Formula/mcs.rb
          git commit -m "Update mcs to ${TAG_NAME}"
          git push
