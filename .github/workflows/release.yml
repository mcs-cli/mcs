name: Release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

concurrency:
  group: release

jobs:
  verify-version:
    name: Verify Version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches source version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          SOURCE_VERSION=$(grep -m1 'static let current' Sources/mcs/CLI.swift | sed 's/.*"\(.*\)".*/\1/')
          if [ "$SOURCE_VERSION" != "$TAG_NAME" ]; then
            echo "::error::Version mismatch: tag is '${TAG_NAME}' but MCSVersion.current is '${SOURCE_VERSION}'. Update MCSVersion.current in Sources/mcs/CLI.swift before tagging."
            exit 1
          fi
          echo "Version check passed: ${TAG_NAME}"

  release-notes:
    name: Release Notes
    needs: verify-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      notes: ${{ steps.build.outputs.notes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build release notes
        id: build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          NOTES=$(.github/scripts/release-notes.sh build "${TAG_NAME}")
          echo "${NOTES}"
          {
            echo "notes<<RELEASE_NOTES_EOF"
            echo "${NOTES}"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

  resolve:
    name: Resolve Dependencies
    needs: verify-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: |
            .build/checkouts
            .build/repositories
            .build/workspace-state.json
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Resolve packages
        run: swift package resolve

  test:
    name: Test
    needs: resolve
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache/restore@v6
        with:
          path: |
            .build/checkouts
            .build/repositories
            .build/workspace-state.json
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Test
        run: swift test

  build-and-release:
    name: Build and Release
    needs: [test, release-notes]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache/restore@v6
        with:
          path: |
            .build/checkouts
            .build/repositories
            .build/workspace-state.json
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build universal binary
        run: |
          swift build -c release --arch arm64 --arch x86_64
          echo "BIN_DIR=$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)" >> "$GITHUB_ENV"

      - name: Verify binary
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          BUILT_VERSION=$("${BIN_DIR}/mcs" --version)
          if [ "$BUILT_VERSION" != "$TAG_NAME" ]; then
            echo "::error::Built binary reports version '${BUILT_VERSION}' but tag is '${TAG_NAME}'"
            exit 1
          fi
          echo "Binary verified: ${BUILT_VERSION}"

      - name: Prepare artifacts
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          TARBALL="mcs-${TAG_NAME}-macos-universal.tar.gz"
          tar -czf "${TARBALL}" -C "${BIN_DIR}" mcs
          shasum -a 256 "${TARBALL}" > SHA256SUMS
          echo "TARBALL=${TARBALL}" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          TARBALL: ${{ env.TARBALL }}
          NOTES: ${{ needs.release-notes.outputs.notes }}
        run: |
          gh release create "${TAG_NAME}" \
            --verify-tag \
            --notes "${NOTES}" \
            "${TARBALL}" SHA256SUMS

      - name: Update Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          TARBALL: ${{ env.TARBALL }}
        if: env.HOMEBREW_TAP_TOKEN != ''
        run: |
          SHA=$(shasum -a 256 "${TARBALL}" | cut -d' ' -f1)

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/mcs-cli/homebrew-tap.git" tap
          cd tap
          cat > Formula/mcs.rb << FORMULA
          class Mcs < Formula
            desc "Configure Claude Code with MCP servers, plugins, skills, and hooks"
            homepage "https://github.com/mcs-cli/mcs"
            url "https://github.com/mcs-cli/mcs/releases/download/${TAG_NAME}/mcs-${TAG_NAME}-macos-universal.tar.gz"
            sha256 "${SHA}"
            version "${TAG_NAME}"
            license "MIT"

            def install
              libexec.install "mcs"
              bin.install_symlink libexec/"mcs"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/mcs --version")
            end
          end
          FORMULA

          git add Formula/mcs.rb
          git commit -m "Update mcs to ${TAG_NAME}"
          git push
