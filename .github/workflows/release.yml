name: Release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

concurrency:
  group: release

env:
  # Same toolchain the Linux PR job installs; kept in one place per workflow.
  SWIFT_VERSION: '6.2.0'

jobs:
  verify-version:
    name: Verify Version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify tag matches source version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          SOURCE_VERSION=$(grep -m1 'static let current' Sources/mcs/CLI.swift | sed 's/.*"\(.*\)".*/\1/')
          if [ "$SOURCE_VERSION" != "$TAG_NAME" ]; then
            echo "::error::Version mismatch: tag is '${TAG_NAME}' but MCSVersion.current is '${SOURCE_VERSION}'. Update MCSVersion.current in Sources/mcs/CLI.swift before tagging."
            exit 1
          fi
          echo "Version check passed: ${TAG_NAME}"

  resolve:
    name: Resolve Dependencies
    needs: verify-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/cache@v5
        with:
          path: |
            .build/checkouts
            .build/repositories
            .build/workspace-state.json
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Resolve packages
        run: swift package resolve

  test:
    name: Test
    needs: resolve
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/cache/restore@v5
        with:
          path: |
            .build/checkouts
            .build/repositories
            .build/workspace-state.json
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Test
        run: swift test

  build-macos:
    name: Build macOS Universal Binary
    needs: [test]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/cache/restore@v5
        with:
          path: |
            .build/checkouts
            .build/repositories
            .build/workspace-state.json
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build universal binary
        run: |
          swift build -c release --arch arm64 --arch x86_64
          echo "BIN_DIR=$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)" >> "$GITHUB_ENV"

      - name: Verify binary
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          BUILT_VERSION=$("${BIN_DIR}/mcs" --version)
          if [ "$BUILT_VERSION" != "$TAG_NAME" ]; then
            echo "::error::Built binary reports version '${BUILT_VERSION}' but tag is '${TAG_NAME}'"
            exit 1
          fi
          echo "Binary verified: ${BUILT_VERSION}"

      - name: Prepare artifact
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: tar -czf "mcs-${TAG_NAME}-macos-universal.tar.gz" -C "${BIN_DIR}" mcs

      - uses: actions/upload-artifact@v4
        with:
          name: mcs-macos-universal
          path: mcs-${{ github.ref_name }}-macos-universal.tar.gz
          if-no-files-found: error

  build-linux:
    name: Build Linux x86_64 Binary
    needs: [test]
    # ubuntu-22.04 on purpose: it sets the glibc floor of the published binary at 2.35.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Swift via swiftly
        run: |
          curl -O https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz
          tar zxf "swiftly-$(uname -m).tar.gz"
          ./swiftly init --quiet-shell-followup --assume-yes --skip-install
          . "$HOME/.local/share/swiftly/env.sh"
          swiftly install --use "$SWIFT_VERSION" --assume-yes
          echo "$HOME/.local/share/swiftly/bin" >> "$GITHUB_PATH"

      - uses: actions/cache@v5
        with:
          path: |
            .build/checkouts
            .build/repositories
            .build/workspace-state.json
          key: spm-linux-${{ hashFiles('Package.swift') }}
          restore-keys: spm-linux-

      - name: Build release binary
        run: |
          swift build -c release --static-swift-stdlib
          echo "BIN_DIR=$(swift build -c release --static-swift-stdlib --show-bin-path)" >> "$GITHUB_ENV"

      - name: Verify binary
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          BUILT_VERSION=$("${BIN_DIR}/mcs" --version)
          if [ "$BUILT_VERSION" != "$TAG_NAME" ]; then
            echo "::error::Built binary reports version '${BUILT_VERSION}' but tag is '${TAG_NAME}'"
            exit 1
          fi
          echo "Binary verified: ${BUILT_VERSION}"

      - name: Prepare artifact
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: tar -czf "mcs-${TAG_NAME}-linux-x86_64.tar.gz" -C "${BIN_DIR}" mcs

      - uses: actions/upload-artifact@v4
        with:
          name: mcs-linux-x86_64
          path: mcs-${{ github.ref_name }}-linux-x86_64.tar.gz
          if-no-files-found: error

  release:
    name: Release
    needs: [build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Checksum artifacts
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          # sha256sum, not shasum: identical "<hash>  <file>" output and present on every runner.
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS
          echo "TARBALL=mcs-${TAG_NAME}-macos-universal.tar.gz" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "${TAG_NAME}" \
            --repo "${{ github.repository }}" \
            --verify-tag \
            --generate-notes \
            *.tar.gz SHA256SUMS

      - name: Update Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          TARBALL: ${{ env.TARBALL }}
        if: env.HOMEBREW_TAP_TOKEN != ''
        run: |
          # The formula keeps pointing at the macOS tarball; Linux ships as a plain release asset.
          SHA=$(sha256sum "${TARBALL}" | cut -d' ' -f1)

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/mcs-cli/homebrew-tap.git" tap
          cd tap
          cat > Formula/mcs.rb << FORMULA
          class Mcs < Formula
            desc "Configure Claude Code with MCP servers, plugins, skills, and hooks"
            homepage "https://github.com/mcs-cli/mcs"
            url "https://github.com/mcs-cli/mcs/releases/download/${TAG_NAME}/mcs-${TAG_NAME}-macos-universal.tar.gz"
            sha256 "${SHA}"
            version "${TAG_NAME}"
            license "MIT"

            def install
              libexec.install "mcs"
              bin.install_symlink libexec/"mcs"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/mcs --version")
            end
          end
          FORMULA

          git add Formula/mcs.rb
          git commit -m "Update mcs to ${TAG_NAME}"
          git push
