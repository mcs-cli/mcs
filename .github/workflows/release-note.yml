name: Release Note

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-note:
    name: Release Note
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check Release note section
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n' "$PR_BODY" | .github/scripts/release-notes.sh check
