name: PR Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # One place for the Linux toolchain version; release.yml pins the same value.
  SWIFT_VERSION: '6.2.0'

jobs:
  lint:
    name: Lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install linters
        run: |
          brew install swiftformat swiftlint || true
          brew upgrade swiftformat swiftlint || true

      - name: SwiftFormat
        run: swiftformat --lint --strict .

      - name: SwiftLint
        run: swiftlint --strict --reporter github-actions-logging

  build-and-test:
    name: Build & Test (${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: |
            .build/checkouts
            .build/repositories
            .build/workspace-state.json
          key: spm-${{ matrix.os }}-${{ hashFiles('Package.swift') }}
          restore-keys: spm-${{ matrix.os }}-

      - name: Swift version
        run: swift --version

      - name: Resolve packages
        run: swift package resolve

      - name: Test
        run: swift test

  build-and-test-linux:
    name: Build & Test (linux)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Not a `container:` job: the official swift images run as root, and
      # UpdateCheckerTests.registryWriteFailureContract asserts that a write into a 0555
      # directory fails, which root ignores.
      - name: Install Swift via swiftly
        # Unpacked outside the checkout so the tree the next steps build and test in stays clean.
        run: |
          cd "$RUNNER_TEMP"
          curl -O https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz
          tar zxf "swiftly-$(uname -m).tar.gz"
          ./swiftly init --quiet-shell-followup --assume-yes --skip-install
          # env.sh lives under $XDG_DATA_HOME when that is set; fail loudly rather than silently
          # continuing without swiftly on PATH if the layout ever moves.
          ENV_SH="${XDG_DATA_HOME:-$HOME/.local/share}/swiftly/env.sh"
          test -f "$ENV_SH" || { echo "::error::swiftly env.sh not found at $ENV_SH"; exit 1; }
          . "$ENV_SH"
          swiftly install --use "$SWIFT_VERSION" --assume-yes
          echo "$SWIFTLY_BIN_DIR" >> "$GITHUB_PATH"

      - uses: actions/cache@v6
        with:
          path: |
            .build/checkouts
            .build/repositories
            .build/workspace-state.json
          key: spm-linux-${{ hashFiles('Package.swift') }}
          restore-keys: spm-linux-

      - name: Swift version
        run: swift --version

      - name: Resolve packages
        run: swift package resolve

      # --no-parallel: corelibs Foundation opens files for writing without O_CLOEXEC, on both its
      # atomic and non-atomic paths, so a test that forks while another is mid-write leaks that
      # write descriptor into the child and a later exec of the same file fails with ETXTBSY.
      # Measured at roughly one failure in four full runs. mcs itself is unaffected — it never
      # executes a file it has just written — so this is a test-runner constraint, not a product
      # limitation, and the macOS jobs stay parallel.
      - name: Test
        run: swift test --no-parallel

      # The shape release.yml ships. Without this, a break in it first shows up on a tag.
      - name: Build release binary
        run: swift build -c release --static-swift-stdlib

  build-universal:
    name: Universal Binary
    needs: lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: |
            .build/checkouts
            .build/repositories
            .build/workspace-state.json
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Resolve packages
        run: swift package resolve

      - name: Build universal binary
        run: swift build -c release --arch arm64 --arch x86_64
