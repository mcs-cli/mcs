name: PR Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep in sync with release.yml, which pins the same toolchain for the release build.
  SWIFT_VERSION: '6.2.0'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install linters
        # Both projects publish fully static Linux binaries, so linting needs no Swift toolchain.
        # SwiftLint's archive carries a dynamically linked `swiftlint` next to `swiftlint-static`;
        # only the static one runs without the Swift runtime installed. Tracking the newest release
        # rather than a pin keeps the macOS behaviour this job replaces, where brew always upgraded.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/linters/bin"
          cd "$RUNNER_TEMP/linters"
          gh release download --repo realm/SwiftLint --pattern swiftlint_linux_amd64.zip
          gh release download --repo nicklockwood/SwiftFormat --pattern swiftformat_linux.zip
          unzip -q swiftlint_linux_amd64.zip -d swiftlint-zip
          unzip -q swiftformat_linux.zip -d swiftformat-zip
          install -m 0755 swiftlint-zip/swiftlint-static bin/swiftlint
          install -m 0755 swiftformat-zip/swiftformat_linux bin/swiftformat
          echo "$RUNNER_TEMP/linters/bin" >> "$GITHUB_PATH"

      # Recorded because the job tracks the newest release: a verdict that changed without a source
      # change is explained by the version that produced it.
      - name: Linter versions
        run: |
          swiftformat --version
          swiftlint --version

      - name: SwiftFormat
        run: swiftformat --lint --strict .

      - name: SwiftLint
        run: swiftlint --strict --reporter github-actions-logging

  build-and-test:
    name: Build & Test (${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: |
            .build/checkouts
            .build/repositories
            .build/workspace-state.json
          key: spm-${{ matrix.os }}-${{ hashFiles('Package.swift') }}
          restore-keys: spm-${{ matrix.os }}-

      - name: Swift version
        run: swift --version

      - name: Resolve packages
        run: swift package resolve

      - name: Test
        run: swift test

  build-and-test-linux:
    name: Build & Test (${{ matrix.runner }})
    needs: lint
    # 22.04 on both arches so PR checks build against the same glibc floor the release does.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
    steps:
      - uses: actions/checkout@v7

      # Not a `container:` job: the official swift images run as root, and
      # UpdateCheckerTests.registryWriteFailureContract asserts that a write into a 0555
      # directory fails, which root ignores.
      - uses: ./.github/actions/setup-swift-linux
        with:
          swift-version: ${{ env.SWIFT_VERSION }}

      - uses: actions/cache@v6
        with:
          path: |
            .build/checkouts
            .build/repositories
            .build/workspace-state.json
          key: spm-${{ matrix.runner }}-${{ hashFiles('Package.swift') }}
          restore-keys: spm-${{ matrix.runner }}-

      - name: Swift version
        run: swift --version

      - name: Resolve packages
        run: swift package resolve

      # --no-parallel: corelibs Foundation opens files for writing without O_CLOEXEC, on both its
      # atomic and non-atomic paths, so a test that forks while another is mid-write leaks that
      # write descriptor into the child and a later exec of the same file fails with ETXTBSY.
      # Measured at roughly one failure in four full runs. mcs itself is unaffected — it never
      # executes a file it has just written — so this is a test-runner constraint, not a product
      # limitation, and the macOS jobs stay parallel.
      - name: Test
        run: swift test --no-parallel

      # The shape release.yml ships. Without this, a break in it first shows up on a tag.
      - name: Build release binary
        run: swift build -c release --static-swift-stdlib

  build-universal:
    name: Universal Binary
    needs: lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: |
            .build/checkouts
            .build/repositories
            .build/workspace-state.json
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Resolve packages
        run: swift package resolve

      - name: Build universal binary
        run: swift build -c release --arch arm64 --arch x86_64
