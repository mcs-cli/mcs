name: Swift package dependencies
description: Restore (and optionally save) the cached package sources, then resolve them.

inputs:
  restore-only:
    description: Restore the cache without saving it — for jobs that run after the one that owns it.
    default: 'false'

runs:
  using: composite
  steps:
    # Dependency *sources* only, and the key is deliberately platform-independent: these are git
    # clones with no absolute paths, so every macOS and Linux job shares one entry. Compiled output
    # is not cached — it is not portable across runner or toolchain, and a cold build of the whole
    # graph costs seconds next to running the suite.
    - if: inputs.restore-only != 'true'
      uses: actions/cache@v6
      with:
        path: |
          .build/checkouts
          .build/repositories
          .build/workspace-state.json
        key: spm-${{ hashFiles('Package.swift') }}
        restore-keys: spm-

    - if: inputs.restore-only == 'true'
      uses: actions/cache/restore@v6
      with:
        path: |
          .build/checkouts
          .build/repositories
          .build/workspace-state.json
        key: spm-${{ hashFiles('Package.swift') }}
        restore-keys: spm-

    - name: Resolve packages
      shell: bash
      run: swift package resolve
